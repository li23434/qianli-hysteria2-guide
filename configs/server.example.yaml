# qianli-hy2 reference only; the installer generates the real private config.
# Do not replace a working configuration with these public placeholders.
listen: :443

acme:
  domains:
    - hy2.example.com
  email: admin@example.com
  ca: letsencrypt
  type: http
  dir: /var/lib/qianli-hysteria/acme

auth:
  type: password
  password: REPLACE_WITH_YOUR_OWN_LONG_RANDOM_PASSWORD
