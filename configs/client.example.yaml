# qianli-hy2 reference for a server with a trusted certificate.
# This is official Hysteria client syntax, not a universal GUI import file.
server: hy2.example.com:443
auth: REPLACE_WITH_YOUR_OWN_LONG_RANDOM_PASSWORD

tls:
  sni: hy2.example.com
  insecure: false

socks5:
  listen: 127.0.0.1:12808

http:
  listen: 127.0.0.1:12809
